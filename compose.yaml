services:
  qwen:
    image: ghcr.io/ghost-soul/qwen:latest
    build:
      context: .
      args:
        VERSION: "1.0.0"
    ports:
      - "127.0.0.1:${QWEN_PORT:-8080}:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
